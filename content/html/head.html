<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Otter emoji icon!!! -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦦</text></svg>">

  {{if description}}<meta name="description" content="{{fill description}}">{{end}}

  <!-- Open Graph https://ogp.me/ -->
  <meta property="og:title" content="{{fill title}}" />
  <meta property="og:type" content="article" />
  <meta property="og:image" content="https://www.jasoneveleth.com/blog/assets/otter64px.png" />
  <meta property="og:image:width" content="64" />
  <meta property="og:image:height" content="64" />
  <meta property="og:article:author" content="Jason Eveleth">
  <meta property="og:article:published_time" content="{{fill date}}">

  {{if hasmath}} {{insert head_katex.html }}   {{end}}
  {{if hascode}} {{insert head_highlight.html }}   {{end}}

  <!-- not used -->
  {{insert style.html }}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">

  <link href="/css/blog.css" rel="stylesheet">

  <title>{{ fill title }}</title>
</head>
<body {{ifdef pageclass}}class="{{fill pageclass}}"{{end}}>
{{insert nav.html}}
<h1 class="post-title">{{fill title}}</h1>

{{ifdef descr}}
<div class="post-descr">
Date: {{fill date}} ｜
Author: Jason Eveleth
</div>
{{end}}
